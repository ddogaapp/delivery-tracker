name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@8
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @delivery-tracker/server build-with-deps
      - name: Create bundle
        run: |
          # pnpm 8 miscalculates its paths when the target is outside the workspace
          pnpm --filter @delivery-tracker/server --prod deploy "$GITHUB_WORKSPACE/.bundle"
          cp LICENSE deploy/ecosystem.config.js .bundle/
          tar -czf "$RUNNER_TEMP/delivery-tracker.tar.gz" -C .bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-tracker
          path: ${{ runner.temp }}/delivery-tracker.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, linux, delivery-tracker]
    timeout-minutes: 30
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/apps/delivery-tracker' }}
      PORT: ${{ vars.PORT || '9000' }}
      APP_NAME: delivery-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delivery-tracker
      - name: Deploy
        env:
          # Keep the runner from killing a PM2 daemon started by this job
          RUNNER_TRACKING_ID: ''
        run: bash .github/scripts/deploy.sh delivery-tracker.tar.gz
