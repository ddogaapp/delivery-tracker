stages:
  - sync
  - deploy

variables:
  IMAGE_TAG: jjongg1101/ddoga-tracker:$CI_PIPELINE_ID
  DOCKER_USER: "jjongg1101"
  # DOCKER_HOST: tcp://docker:2375
  # DOCKER_TLS_CERTDIR: ""
  # DOCKER_BUILDKIT: "1"

sync-with-github:
  stage: sync
  image: bitnami/git:latest
  script:
    - git config --global user.email "gitlab-ci-token@gitlab.example.com"
    - git config --global user.name "GitLab CI Bot"

    # 인증 및 원격 저장소 설정
    - git remote set-url origin http://oauth2:${GIT_PUSH_TOKEN}@gitlab.hecton.co.kr:8090/${CI_PROJECT_PATH}.git
    - git remote add upstream https://github.com/jongyeolPark/delivery-tracker.git

    - git fetch upstream
    
    # [권장] 로컬 master를 원격(origin) master와 강제로 똑같이 맞추고 시작 (꼬임 방지)
    - git checkout -B master origin/master

    # 병합 (충돌 시 upstream 내용 채택)
    - git merge upstream/main --allow-unrelated-histories -X theirs -m "Sync from GitHub Upstream"

    # [수정됨] 강제 푸시 실행
    - git push origin master
  
  only:
    - schedules

deploy_job:
  stage: deploy
  image: docker:20.10.16
  # services:
    # - docker:20.10.16-dind
  
  variables:
    APP_SERVER_USER: "ubuntu"     
  
  before_script:
    # 1. SSH 환경 설정 (app-server)
    - echo "Loading SSH key and setting up SSH config..."
    - apt-get update -qy && apt-get install -y openssl openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PROD" | base64 -d > ~/.ssh/brainhc_ltc.pem
    - chmod 600 ~/.ssh/brainhc_ltc.pem
    - printf "Host bastion\n  HostName ${BASTION_HOST}\n  Port ${BASTION_PORT}\n  User ${BASTION_USER}\n  IdentityFile ~/.ssh/brainhc_ltc.pem\n  ForwardAgent yes\n  StrictHostKeyChecking no\n\nHost app-server\n  HostName ${APP_SERVER_IP}\n  User ${APP_SERVER_USER}\n  IdentityFile ~/.ssh/brainhc_ltc.pem\n  ProxyJump bastion\n  StrictHostKeyChecking no\n" > ~/.ssh/config

  script:
    # 2. 빌드 및 푸시
    - echo "Docker Hub Login..."
    - echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin
    - echo "Building image... $IMAGE_TAG"
    - docker build --platform linux/arm64 -t $IMAGE_TAG .
    - echo "Pushing image..."
    - docker push $IMAGE_TAG

    # 3. 배포
    - echo "Deploying to EC2..."
    - ssh app-server "
        echo '$DOCKER_TOKEN' | docker login -u '$DOCKER_USER' --password-stdin &&
        docker pull $IMAGE_TAG &&
        docker stop ddoga-container || true &&
        docker rm ddoga-container || true &&
        docker run -d --name ddoga-container -p 8000:4000 $IMAGE_TAG
      "
    - echo "Deployment Successful!" 

  only:
    - master