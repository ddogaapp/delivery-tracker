stages:
  - sync
  - deploy

variables:
  IMAGE_TAG: jjongg1101/ddoga-tracker:$CI_COMMIT_SHORT_SHA
  DOCKER_USER: "jjongg1101"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: "" # TLS 비활성화 (2375 포트 연결 필수)
  
deploy_job:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  
  variables:
    EC2_HOST: "REDACTED_IP"
    EC2_USER: "ubuntu"
    
  script:
    # 1. SSH 환경 설정
    - echo "Loading SSH key and setting up SSH config..."
    - apt-get update -qy && apt-get install -y openssl openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_DEV" | base64 -d > ~/.ssh/brainhc_ltc.pem
    - chmod 600 ~/.ssh/brainhc_ltc.pem
    - printf "Host app-server\n  HostName ${EC2_HOST}\n  User ${EC2_USER}\n  IdentityFile ~/.ssh/brainhc_ltc.pem\n  StrictHostKeyChecking no\n" > ~/.ssh/config

    # - apk update && apk add --no-cache openssh-client
    # - mkdir -p ~/.ssh 
    # - echo "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
    # - chmod 600 ~/.ssh/id_rsa
    # - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

    # 2. 빌드 및 푸시
    - echo "Docker Hub Login..."
    - echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

    - echo "Building image... $IMAGE_TAG"
    - docker build -t $IMAGE_TAG .

    - echo "Pushing image..."
    - docker push $IMAGE_TAG

    # 3. 배포 (수정 포인트: 포트 4000 사용, IMAGE_TAG 사용)
    - echo "Deploying to EC2..."
    - ssh app-server "
        echo '$DOCKER_TOKEN' | docker login -u '$DOCKER_USER' --password-stdin &&
        docker pull $IMAGE_TAG &&
        docker stop ddoga-container || true &&
        docker rm ddoga-container || true &&
        docker run -d --name ddoga-container -p 80:4000 $IMAGE_TAG
      "
    - echo "Deployment Successful!" 

  only:
    - master # 브랜치명이 main인지 master인지 꼭 확인하세요!