stages:
  - sync
  - deploy

deploy_job:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  
  script:
    # 1. 환경 설정
    - apk update && apk add --no-cache openssh-client
    
    # [수정됨] 폴더 생성 먼저 수행 (필수)
    - mkdir -p ~/.ssh 
    
    # [수정됨] base64 디코딩 제거 (변수에 원본 텍스트가 들어있다면 제거해야 함)
    - echo "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
    
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

    # 2. 빌드 및 푸시
    - echo "Build & Push Start..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG

    # 3. 배포
    - echo "Deploying to EC2..."
    - ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $LATEST_TAG &&
        docker stop my-app-container || true &&
        docker rm my-app-container || true &&
        docker run -d --name my-app-container -p 80:3000 $LATEST_TAG
      "
    - echo "Deployment Successful!"    

  variables:
    EC2_HOST: "REDACTED_IP"
    EC2_USER: "ubuntu"
    
  only:
    - master # 브랜치명이 main인지 master인지 꼭 확인하세요!